name: Daily Grand pipeline

on:
  schedule:
    # Runs daily; scrape.py is idempotent (dedupes), so this is safe even on
    # days with no new draw and immune to holiday-shifted draw dates.
    - cron: "30 11 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-run predict/backfill even when no new draw was scraped (use after a data fix)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-grand-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Scrape latest draws
        id: scrape
        run: python scripts/scrape.py

      - name: Compute hot numbers and pairs
        run: python scripts/stats.py

      - name: Retrain and predict
        if: steps.scrape.outputs.new_draws == 'true' || inputs.force
        run: python scripts/predict.py

      # If the scraper ever stalls and then catches up on several draws at
      # once, those draws land with no prediction against them and can never
      # be scored. backfill.py walk-forward fills any such gap (and is a no-op
      # on a normal day, when every recent draw already has a prediction).
      - name: Backfill predictions for any missed draws
        if: steps.scrape.outputs.new_draws == 'true' || inputs.force
        run: python scripts/backfill.py

      - name: Rebuild audit and dashboard JSON
        if: steps.scrape.outputs.new_draws == 'true' || inputs.force
        run: python scripts/predict.py

      - name: Commit updated data + dashboard
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update draws, prediction, and dashboard data"
          file_pattern: "daily_grand_results.csv future_draws.csv docs/data/*.json"

      # The email links straight to the dashboard, so it must not go out until
      # Vercel has actually published the new data. Wait for the deploy that
      # the commit above triggered before notifying.
      - name: Wait for Vercel deploy
        if: steps.scrape.outputs.new_draws == 'true'
        run: |
          url="${{ vars.DASHBOARD_URL }}"
          target=$(python -c "import json;print(json.load(open('docs/data/prediction.json'))['target_date'])")
          for i in $(seq 1 30); do
            sleep 10
            if curl -fsS "${url%/}/data/prediction.json" | grep -q "$target"; then
              echo "Dashboard is serving $target after $((i*10))s."
              exit 0
            fi
          done
          echo "::warning::Dashboard still not serving $target after 5 minutes; sending email anyway."

      - name: Send email notification
        if: steps.scrape.outputs.new_draws == 'true'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: python scripts/notify.py
